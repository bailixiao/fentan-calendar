<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>分壇教育組報名</title>
  <meta name="description" content="分壇教育組的班：高大班、青少年班，每一堂都可以在這裡報名">
  <!-- 加到手機主畫面時的圖示與名稱 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="教育組報名">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fentan-calendar-api.duty-calendar-worker.workers.dev" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261015e">
  <script>try { var t = localStorage.getItem('fentan-calendar:text-size'); if (t === 'l' || t === 'xl') document.documentElement.classList.add('text-' + t); } catch (e) {}</script>
</head>
<body>
  <header class="app-header">
    <a class="app-title" href="#/"><span class="header-back" aria-hidden="true">‹</span><span>分壇教育組報名</span></a>
    <button type="button" class="text-size-btn" id="text-size" aria-label="字體大小">A＋</button>
  </header>

  <main class="app-main">
    <section id="view-home" aria-label="可以報名的班">
      <div class="top-btns">
        <button type="button" class="btn push-open" id="push-open" aria-expanded="false" aria-controls="push-panel">🔔 手機提醒</button>
      </div>
      <section id="push-panel" class="push-panel" hidden aria-label="手機提醒">
        <div class="push-head"><h2>🔔 手機提醒</h2><button type="button" class="link-btn" data-act="close">收起</button></div>
        <div class="push-body"></div>
      </section>
      <div id="board" class="board"></div>
      <a class="btn btn-block help-link" href="#/help">❓ 常見問題</a>
    </section>

    <section id="view-page" class="detail-view" hidden></section>
    <section id="view-help" class="help-view" hidden></section>
    <section id="view-admin" class="admin-view" hidden></section>
  </main>

  <footer class="app-footer"><a href="#/admin">管理者</a></footer>

  <div id="busy" class="busy" role="alertdialog" aria-modal="true" aria-live="assertive" hidden>
    <div class="busy-box">
      <span class="spinner" aria-hidden="true"></span>
      <p class="busy-text"></p>
    </div>
  </div>

  <!-- 改了 js、css 後把 ?v= 的日期換新，手機才不會用到舊的檔案（GitHub Pages 會快取 10 分鐘） -->
  <script src="js/site.js?v=20261015e"></script>
  <script src="js/config.js?v=20261015e"></script>
  <script src="js/api.js?v=20261015e"></script>
  <script src="js/format.js?v=20261015e"></script>
  <script src="js/home.js?v=20261015e"></script>
  <script src="js/help.js?v=20261015e"></script>
  <script src="js/push.js?v=20261015e"></script>
  <script src="js/admin.js?v=20261015e"></script>
  <script src="js/app.js?v=20261015e"></script>
</body>
</html>
