# Cloudflare Worker 設定。部署：cd worker && npx wrangler deploy
# 管理密碼：npx wrangler secret put ADMIN_PASSWORD（由管理者自己輸入，不寫進程式碼）
name = "fentan-calendar-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
# 教全區的 API 也在這個帳號的 workers.dev 底下：同帳號的 Worker 預設不能直接互連，加這個讓它走公開網路去讀
compatibility_flags = ["global_fetch_strictly_public"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "CalendarStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CalendarStore"]

[observability]
enabled = true
